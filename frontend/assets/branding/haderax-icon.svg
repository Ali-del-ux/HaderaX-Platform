<svg xmlns="http://www.w3.org/2000/svg" viewBox="110 220 580 365" width="100%" height="100%">
  <defs>
    <linearGradient id="mark_skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="45%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <linearGradient id="mark_skyWing" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="60%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <linearGradient id="mark_leftWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="25%" stop-color="#F59E0B"/>
      <stop offset="80%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <linearGradient id="mark_rightWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="40%" stop-color="#B45309"/>
      <stop offset="85%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>

    <linearGradient id="mark_leftReveal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="mark_rightReveal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451A03"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <linearGradient id="mark_prowRidge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <linearGradient id="mark_goldRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.2"/>
      <stop offset="25%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FEF08A"/>
      <stop offset="75%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="mark_softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <g filter="url(#mark_softShadow)">
    <!-- 1. BACKDROP CELESTIAL SEGMENTED DOME -->
    <path d="M 133.17 433.47 A 275 275 0 0 1 219.58 292.45 L 324.55 413.21 A 115 115 0 0 0 288.42 472.18 Z" fill="url(#mark_skyWing)"/>
    <path d="M 230.69 283.30 A 275 275 0 0 1 385.61 225.38 L 393.98 385.16 A 115 115 0 0 0 329.20 409.38 Z" fill="url(#mark_skyGrad)"/>
    <path d="M 414.39 225.38 A 275 275 0 0 1 569.31 283.30 L 470.80 409.38 A 115 115 0 0 0 406.02 385.16 Z" fill="url(#mark_skyGrad)"/>
    <path d="M 580.42 292.45 A 275 275 0 0 1 666.83 433.47 L 511.58 472.18 A 115 115 0 0 0 475.45 413.21 Z" fill="url(#mark_skyWing)"/>
    <path d="M 120 500 A 282 282 0 0 1 680 500" fill="none" stroke="#FBBF24" stroke-width="2.5" stroke-dasharray="8 12" opacity="0.8"/>

    <!-- 2. FOUNDATION / MODERN GOLDEN BASE RIBBON -->
    <path d="M 160 520 Q 400 575 640 520 Q 400 558 160 520 Z" fill="url(#mark_goldRibbon)"/>
    <path d="M 160 520 Q 400 575 640 520" fill="none" stroke="#FEF08A" stroke-width="2.5" opacity="0.9"/>

    <!-- 3. CITADEL WALLS -->
    <path d="M 400 275
             L 385 278 L 385 296 L 365 300 L 365 282 L 335 288 L 335 306 L 315 310 L 315 292 L 285 298 L 285 316 L 265 320 L 265 302 L 230 309 L 230 327 L 195 334
             L 195 490 L 400 535 Z"
          fill="url(#mark_leftWall)"/>

    <path d="M 400 275
             L 415 278 L 415 296 L 435 300 L 435 282 L 465 288 L 465 306 L 485 310 L 485 292 L 515 298 L 515 316 L 535 320 L 535 302 L 570 309 L 570 327 L 605 334
             L 605 490 L 400 535 Z"
          fill="url(#mark_rightWall)"/>

    <line x1="400" y1="272" x2="400" y2="535" stroke="url(#mark_prowRidge)" stroke-width="4" stroke-linecap="round"/>
    <path d="M 195 344 L 400 306 L 605 344" fill="none" stroke="#FEF08A" stroke-width="2" opacity="0.4"/>

    <!-- 4. SIGNATURE ANDALUSIAN ARCHES -->
    <g transform="translate(242, 355) skewY(11.5)">
      <path d="M 0 35 L 0 18 A 17 17 0 0 1 34 18 L 34 35 L 28 35 L 28 18 A 11 11 0 0 0 6 18 L 6 35 Z" fill="url(#mark_leftReveal)"/>
      <rect x="5" y="0" width="24" height="78" rx="12" ry="12" fill="url(#mark_skyGrad)"/>
      <path d="M 5 12 A 12 12 0 0 1 29 12 L 29 22 L 5 22 Z" fill="#0F172A" opacity="0.35"/>
    </g>

    <g transform="translate(320, 335) skewY(11.5)">
      <path d="M 0 45 L 0 22 A 21 21 0 0 1 42 22 L 42 45 L 35 45 L 35 22 A 14 14 0 0 0 7 22 L 7 45 Z" fill="url(#mark_leftReveal)"/>
      <rect x="6" y="0" width="30" height="96" rx="15" ry="15" fill="url(#mark_skyGrad)"/>
      <path d="M 6 15 A 15 15 0 0 1 36 15 L 36 26 L 6 26 Z" fill="#0F172A" opacity="0.35"/>
    </g>

    <g transform="translate(438, 335) skewY(-11.5)">
      <path d="M 0 45 L 0 22 A 21 21 0 0 1 42 22 L 42 45 L 35 45 L 35 22 A 14 14 0 0 0 7 22 L 7 45 Z" fill="url(#mark_rightReveal)"/>
      <rect x="6" y="0" width="30" height="96" rx="15" ry="15" fill="url(#mark_skyGrad)"/>
      <path d="M 6 15 A 15 15 0 0 1 36 15 L 36 28 L 6 28 Z" fill="#0F172A" opacity="0.45"/>
    </g>

    <g transform="translate(524, 355) skewY(-11.5)">
      <path d="M 0 35 L 0 18 A 17 17 0 0 1 34 18 L 34 35 L 28 35 L 28 18 A 11 11 0 0 0 6 18 L 6 35 Z" fill="url(#mark_rightReveal)"/>
      <rect x="5" y="0" width="24" height="78" rx="12" ry="12" fill="url(#mark_skyGrad)"/>
      <path d="M 5 12 A 12 12 0 0 1 29 12 L 29 22 L 5 22 Z" fill="#0F172A" opacity="0.45"/>
    </g>

    <g transform="translate(582, 375) skewY(-11.5)">
      <rect x="0" y="0" width="7" height="36" rx="3.5" fill="#080D1A"/>
      <rect x="1" y="2" width="5" height="32" rx="2.5" fill="url(#mark_skyGrad)" opacity="0.8"/>
    </g>

    <!-- 5. APEX STAR -->
    <circle cx="400" cy="256" r="3.5" fill="#FFFFFF"/>
    <polygon points="400,242 402,254 414,256 402,258 400,270 398,258 386,256 398,254" fill="#FDE047"/>
  </g>
</svg>