<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 880" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Alexandria:wght@800;900&amp;family=Outfit:wght@800;900&amp;display=swap');
    </style>

    <linearGradient id="c1_skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="45%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <linearGradient id="c1_skyWing" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="60%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <linearGradient id="c1_leftWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="25%" stop-color="#F59E0B"/>
      <stop offset="80%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <linearGradient id="c1_rightWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="40%" stop-color="#B45309"/>
      <stop offset="85%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>

    <linearGradient id="c1_leftReveal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="c1_rightReveal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451A03"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <linearGradient id="c1_prowRidge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Modern Golden Horizon Ribbon Base -->
    <linearGradient id="c1_goldRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.2"/>
      <stop offset="25%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FEF08A"/>
      <stop offset="75%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="c1_softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width='100%' height='100%' fill='#F8FAFC' rx='32'/>

  <!-- ==================== THE EMBLEM ==================== -->
  <g transform="translate(0, -10)">
    <!-- 1. BACKDROP CELESTIAL SEGMENTED DOME -->
    <g filter="url(#c1_softShadow)">
      <path d="M 133.17 433.47 A 275 275 0 0 1 219.58 292.45 L 324.55 413.21 A 115 115 0 0 0 288.42 472.18 Z" fill="url(#c1_skyWing)"/>
      <path d="M 230.69 283.30 A 275 275 0 0 1 385.61 225.38 L 393.98 385.16 A 115 115 0 0 0 329.20 409.38 Z" fill="url(#c1_skyGrad)"/>
      <path d="M 414.39 225.38 A 275 275 0 0 1 569.31 283.30 L 470.80 409.38 A 115 115 0 0 0 406.02 385.16 Z" fill="url(#c1_skyGrad)"/>
      <path d="M 580.42 292.45 A 275 275 0 0 1 666.83 433.47 L 511.58 472.18 A 115 115 0 0 0 475.45 413.21 Z" fill="url(#c1_skyWing)"/>

      <!-- Golden Orbital Trim -->
      <path d="M 120 500 A 282 282 0 0 1 680 500" fill="none" stroke="#FBBF24" stroke-width="2.5" stroke-dasharray="8 12" opacity="0.8"/>
    </g>

    <!-- 2. FOUNDATION / MODERN GOLDEN BASE RIBBON -->
    <g filter="url(#c1_softShadow)">
      <!-- Smooth Aerodynamic Ribbon Curve -->
      <path d="M 160 520 Q 400 575 640 520 Q 400 558 160 520 Z" fill="url(#c1_goldRibbon)"/>
      <path d="M 160 520 Q 400 575 640 520" fill="none" stroke="#FEF08A" stroke-width="2.5" opacity="0.9"/>
    </g>

    <!-- 3. CITADEL WALLS (ARCHITECTURAL HERITAGE) -->
    <g filter="url(#c1_softShadow)">
      <!-- Left Wall Body -->
      <path d="M 400 275
               L 385 278 L 385 296 L 365 300 L 365 282 L 335 288 L 335 306 L 315 310 L 315 292 L 285 298 L 285 316 L 265 320 L 265 302 L 230 309 L 230 327 L 195 334
               L 195 490 L 400 535 Z"
            fill="url(#c1_leftWall)"/>

      <!-- Right Wall Body -->
      <path d="M 400 275
               L 415 278 L 415 296 L 435 300 L 435 282 L 465 288 L 465 306 L 485 310 L 485 292 L 515 298 L 515 316 L 535 320 L 535 302 L 570 309 L 570 327 L 605 334
               L 605 490 L 400 535 Z"
            fill="url(#c1_rightWall)"/>

      <!-- Central Prow Ridge Line -->
      <line x1="400" y1="272" x2="400" y2="535" stroke="url(#c1_prowRidge)" stroke-width="4" stroke-linecap="round"/>

      <!-- Cornice Accent Line -->
      <path d="M 195 344 L 400 306 L 605 344" fill="none" stroke="#FEF08A" stroke-width="2" opacity="0.4"/>
    </g>

    <!-- 4. SIGNATURE ANDALUSIAN ARCHES (OPENINGS TO THE SKY) -->
    <g>
      <!-- LEFT OUTER ARCH -->
      <g transform="translate(242, 355) skewY(11.5)">
        <path d="M 0 35 L 0 18 A 17 17 0 0 1 34 18 L 34 35 L 28 35 L 28 18 A 11 11 0 0 0 6 18 L 6 35 Z" fill="url(#c1_leftReveal)"/>
        <rect x="5" y="0" width="24" height="78" rx="12" ry="12" fill="url(#c1_skyGrad)"/>
        <path d="M 5 12 A 12 12 0 0 1 29 12 L 29 22 L 5 22 Z" fill="#0F172A" opacity="0.35"/>
      </g>

      <!-- LEFT INNER ARCH -->
      <g transform="translate(320, 335) skewY(11.5)">
        <path d="M 0 45 L 0 22 A 21 21 0 0 1 42 22 L 42 45 L 35 45 L 35 22 A 14 14 0 0 0 7 22 L 7 45 Z" fill="url(#c1_leftReveal)"/>
        <rect x="6" y="0" width="30" height="96" rx="15" ry="15" fill="url(#c1_skyGrad)"/>
        <path d="M 6 15 A 15 15 0 0 1 36 15 L 36 26 L 6 26 Z" fill="#0F172A" opacity="0.35"/>
      </g>

      <!-- RIGHT INNER ARCH -->
      <g transform="translate(438, 335) skewY(-11.5)">
        <path d="M 0 45 L 0 22 A 21 21 0 0 1 42 22 L 42 45 L 35 45 L 35 22 A 14 14 0 0 0 7 22 L 7 45 Z" fill="url(#c1_rightReveal)"/>
        <rect x="6" y="0" width="30" height="96" rx="15" ry="15" fill="url(#c1_skyGrad)"/>
        <path d="M 6 15 A 15 15 0 0 1 36 15 L 36 28 L 6 28 Z" fill="#0F172A" opacity="0.45"/>
      </g>

      <!-- RIGHT OUTER ARCH -->
      <g transform="translate(524, 355) skewY(-11.5)">
        <path d="M 0 35 L 0 18 A 17 17 0 0 1 34 18 L 34 35 L 28 35 L 28 18 A 11 11 0 0 0 6 18 L 6 35 Z" fill="url(#c1_rightReveal)"/>
        <rect x="5" y="0" width="24" height="78" rx="12" ry="12" fill="url(#c1_skyGrad)"/>
        <path d="M 5 12 A 12 12 0 0 1 29 12 L 29 22 L 5 22 Z" fill="#0F172A" opacity="0.45"/>
      </g>

      <!-- Bastion Slit Window -->
      <g transform="translate(582, 375) skewY(-11.5)">
        <rect x="0" y="0" width="7" height="36" rx="3.5" fill="#080D1A"/>
        <rect x="1" y="2" width="5" height="32" rx="2.5" fill="url(#c1_skyGrad)" opacity="0.8"/>
      </g>
    </g>

    <!-- 5. APEX INNOVATION SPARK -->
    <g>
      <circle cx="400" cy="256" r="3.5" fill="#FFFFFF"/>
      <polygon points="400,242 402,254 414,256 402,258 400,270 398,258 386,256 398,254" fill="#FDE047"/>
    </g>
  </g>

  <!-- TYPOGRAPHY -->
  
    <g transform="translate(400, 715)" text-anchor="middle">
      <text y="0" font-family="'Alexandria', 'Cairo', sans-serif" font-size="52" font-weight="900" fill="#0F172A">
        حاضر<tspan fill="#0EA5E9">إكس</tspan>
      </text>
      <text y="42" font-family="'Outfit', 'Montserrat', sans-serif" font-size="22" font-weight="900" fill="#0F172A" letter-spacing="8">
        HADERA <tspan fill="#0EA5E9">X</tspan>
      </text>
      <text y="70" font-family="'Alexandria', sans-serif" font-size="13" font-weight="600" fill="#64748B" letter-spacing="3">
        منصة الحاضرة للتقنية والابتكار
      </text>
    </g>
</svg>