<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>إعادة تعيين كلمة المرور — حاضراكس | HaderaX</title>
    
    <link rel="icon" type="image/svg+xml" href="assets/branding/favicon.svg">
    <link rel="alternate icon" href="assets/branding/favicon.ico">
    <link rel="apple-touch-icon" href="assets/branding/apple-touch-icon.png">

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="assets/js/tailwind-config.js"></script>
    
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;700;800;900&family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Outfit:wght@600;800;900&family=JetBrains+Mono:wght@400&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-surface-container-lowest h-screen w-full flex flex-col md:flex-row overflow-hidden text-on-surface">

    <!-- Right Column (Reset Password Form) -->
    <div class="w-full md:w-1/2 h-full flex items-center justify-center bg-surface-container-lowest p-8 lg:p-24 overflow-y-auto">
        <div class="w-full max-w-md space-y-8">
            <div class="text-center md:text-right">
                <h1 class="font-headline-lg text-headline-lg text-on-background mb-2">كلمة مرور جديدة 🔑</h1>
                <p class="font-body-md text-body-md text-secondary">الرجاء إدخال كلمة المرور الجديدة وتأكيدها بدقة لاستعادة كامل الصلاحيات لحسابك.</p>
            </div>
            
            <!-- نموذج إدخال كلمات المرور الجديدة -->
            <form id="reset-password-form" class="space-y-6 mt-8">
                <!-- كلمة المرور الجديدة -->
                <div>
                    <label class="block font-label-md text-label-md text-on-surface-variant mb-2" for="new-password">كلمة المرور الجديدة</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-secondary">
                            <span class="material-symbols-outlined">lock_open</span>
                        </div>
                        <input class="w-full pl-3 pr-10 py-3 bg-surface-bright border border-border-subtle rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-200 font-body-md text-body-md placeholder:text-secondary-fixed-dim text-on-surface" id="new-password" name="new-password" placeholder="•••••••• (6 خانات على الأقل)" type="password" required>
                    </div>
                </div>

                <!-- تأكيد كلمة المرور الجديدة -->
                <div>
                    <label class="block font-label-md text-label-md text-on-surface-variant mb-2" for="confirm-password">تأكيد كلمة المرور الجديدة</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-secondary">
                            <span class="material-symbols-outlined">enhanced_encryption</span>
                        </div>
                        <input class="w-full pl-3 pr-10 py-3 bg-surface-bright border border-border-subtle rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-200 font-body-md text-body-md placeholder:text-secondary-fixed-dim text-on-surface" id="confirm-password" name="confirm-password" placeholder="أعد إدخال الكلمة الجديدة للتأكيد" type="password" required>
                    </div>
                </div>

                <!-- زر التحديث -->
                <button id="submit-btn" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm font-label-md text-label-md text-on-primary bg-primary-container hover:bg-surface-tint focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all duration-300" type="submit">
                    تحديث كلمة المرور والدخول
                </button>
            </form>

            <!-- حاوية عرض التنبيهات المخصصة الفخمة للخطأ أو النجاح المباشر -->
            <div id="alert-container" class="hidden mt-6 animate-scale-in">
                <div id="alert-card" class="flex gap-3 p-4 rounded-xl border">
                    <span id="alert-icon" class="material-symbols-outlined text-2xl flex-shrink-0"></span>
                    <div class="flex flex-col gap-1">
                        <h4 id="alert-title" class="font-bold text-sm"></h4>
                        <p id="alert-message" class="text-xs text-secondary leading-relaxed"></p>
                    </div>
                </div>
            </div>

            <!-- Mobile Fallback Branding (Only visible on small screens) -->
            <div class="mt-12 text-center md:hidden border-t border-border-subtle pt-6 flex flex-col items-center gap-2">
                <img src="assets/branding/haderax-logo-transparent.svg" alt="HaderaX" class="w-10 h-10 object-contain">
                <p class="font-label-md text-label-md text-secondary">منصة حاضراكس — جامعة الحاضرة</p>
            </div>
        </div>
    </div>

    <!-- Left Column (Branding - Hidden on Mobile) -->
    <div class="hidden md:flex md:w-1/2 h-full bg-gradient-to-br from-primary-container via-primary to-gold-deep relative flex-col items-center justify-center p-12 overflow-hidden">
        <!-- Mesh/Geometric Overlay -->
        <div class="absolute inset-0 bg-mesh-pattern opacity-30 mix-blend-overlay pointer-events-none"></div>
        <!-- Subtle Glow Effect -->
        <div class="absolute top-1/4 left-1/4 w-72 h-72 bg-gold-light opacity-20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="relative z-10 flex flex-col items-center text-center text-on-primary space-y-6 max-w-lg">
            <div class="w-36 h-36 flex items-center justify-center mb-2 filter drop-shadow-2xl transition-transform hover:scale-105">
                <img src="assets/branding/haderax-icon.svg" alt="HaderaX Brandmark" class="w-full h-full object-contain">
            </div>
            <div class="space-y-2">
                <h2 class="font-headline-xl text-headline-xl text-white tracking-tight">إعادة تعيين كلمة المرور</h2>
                <h3 class="font-headline-md text-headline-md text-white/90">جامعة الحاضرة • University of Alhadera</h3>
            </div>
            <div class="w-16 h-1 bg-white/50 rounded-full my-6"></div>
            <p class="font-body-lg text-body-lg text-white/90 leading-relaxed font-light">
                قم بتعبئة كلمة مرور قوية وغير متكررة لحفظ خصوصية حسابك الأكاديمي
            </p>
        </div>
    </div>

    <!-- ============================================================================== -->
    <!-- منطق التفاعل البرمجي واستخلاص التوكن (Reset Password JS Logic) -->
    <!-- ============================================================================== -->
    <script>
        const resetForm = document.getElementById('reset-password-form');
        const alertContainer = document.getElementById('alert-container');
        const alertCard = document.getElementById('alert-card');
        const alertIcon = document.getElementById('alert-icon');
        const alertTitle = document.getElementById('alert-title');
        const alertMessage = document.getElementById('alert-message');
        const submitBtn = document.getElementById('submit-btn');

        // استخلاص توكن الاستعادة العشوائي من معلمة البحث بالرابط (window.location.search)
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        // تطبيق التحقق الأمني الفوري قبل تحميل الحقول وتفادي الإدخالات الفارغة
        if (!token) {
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
            
            showAlert(
                '⚠️ رمز الاستعادة مفقود!', 
                'لا يمكن إكمال هذه العملية لغياب رمز الاستعادة الأمني في الرابط. يرجى إعادة طلب رابط جديد من صفحة نسيان كلمة المرور.', 
                'error'
            );
        }

        /**
         * دالة مساعدة لعرض كروت التنبيهات الملونة والراقية
         */
        function showAlert(title, message, type) {
            if (!alertContainer || !alertCard || !alertIcon || !alertTitle || !alertMessage) return;

            alertTitle.textContent = title;
            alertMessage.textContent = message;

            if (type === 'success') {
                alertCard.className = "flex gap-3 p-4 rounded-xl border border-emerald-500/20 bg-emerald-50 text-emerald-900";
                alertIcon.className = "material-symbols-outlined text-emerald-600 text-2xl flex-shrink-0";
                alertIcon.textContent = "check_circle";
            } else if (type === 'error') {
                alertCard.className = "flex gap-3 p-4 rounded-xl border border-red-500/20 bg-red-50 text-red-900";
                alertIcon.className = "material-symbols-outlined text-red-600 text-2xl flex-shrink-0";
                alertIcon.textContent = "error";
            } else {
                alertCard.className = "flex gap-3 p-4 rounded-xl border border-amber-500/20 bg-amber-50 text-amber-900";
                alertIcon.className = "material-symbols-outlined text-amber-600 text-2xl flex-shrink-0";
                alertIcon.textContent = "warning";
            }

            alertContainer.classList.remove('hidden');
        }

        // مستمع إرسال بيانات الاستبدال والتعديل
        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!token) return;

            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            // التحقق المحلي الفوري من صحة ومطابقة كلمتي المرور
            if (newPassword !== confirmPassword) {
                showAlert('⚠️ عدم تطابق كلمتي المرور!', 'كلمتا المرور المدخلتان غير متطابقتين. يرجى إدخالهما بدقة.', 'warning');
                return;
            }

            if (newPassword.length < 6) {
                showAlert('⚠️ كلمة مرور ضعيفة!', 'يجب ألا تقل كلمة المرور الجديدة عن 6 خانات على الأقل.', 'warning');
                return;
            }

            try {
                const backendUrl = `http://${window.location.hostname}:3000/api/auth/reset-password`;
                const response = await fetch(backendUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ token, newPassword })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'فشل تعيين كلمة المرور الجديدة');
                }

                // إشعار بالنجاح وتوجيه فوري لصفحة الدخول
                showAlert('🎉 تم تحديث الكلمة بنجاح!', 'تم تعيين كلمة المرور الجديدة بنجاح. جاري توجيهك لصفحة تسجيل الدخول للدخول الفوري بالكلمة الجديدة...', 'success');
                resetForm.reset();
                submitBtn.disabled = true;

                setTimeout(() => {
                    window.location.replace('login.html');
                }, 2000);

            } catch (error) {
                console.error('❌ خطأ إعادة التعيين:', error);
                showAlert('❌ فشل تعيين كلمة المرور!', error.message, 'error');
            }
        });
    </script>
</body>
</html>
